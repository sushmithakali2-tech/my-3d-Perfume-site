<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aurelle Perfume</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg1:#fbeee9; --bg2:#f0cfc9; --ink:#3b1522; --muted:#7a5560; --accent:#3b1522; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family:'DM Sans',system-ui,sans-serif; color:var(--ink); min-height:100vh;
         background: radial-gradient(circle at 70% 40%, var(--bg1), var(--bg2)); overflow-x:hidden; }
  .page { display:grid; grid-template-columns: 1fr 1.1fr; align-items:center; min-height:100vh; max-width:1200px; margin:0 auto; padding:0 24px; }
  .info { padding:40px 0; }
  .brand { font-weight:500; letter-spacing:.08em; font-size:.95rem; color:var(--muted); margin-bottom:28px; }
  h1 { font-family:'Cormorant Garamond',Georgia,serif; font-weight:600; font-size:clamp(2.8rem,6vw,4.6rem); line-height:1.02; }
  .tag { margin:18px 0 28px; max-width:34ch; line-height:1.6; color:var(--muted); }
  .shade-label { font-size:.9rem; margin-bottom:10px; }
  .shade-label b { font-weight:500; }
  .swatches { display:flex; gap:12px; margin-bottom:32px; }
  .swatch { width:38px; height:38px; border-radius:50%; border:2px solid transparent; cursor:pointer; outline-offset:3px; }
  .swatch[aria-pressed="true"] { border-color:var(--ink); box-shadow:0 0 0 3px var(--bg1) inset; }
  .buy { display:flex; align-items:center; gap:20px; }
  .price { font-family:'Cormorant Garamond',Georgia,serif; font-size:1.9rem; font-weight:600; }
  button.cta { background:var(--accent); color:#fff; border:0; padding:15px 30px; border-radius:999px; font:500 1rem 'DM Sans',sans-serif; cursor:pointer; transition:transform .15s; }
  button.cta:hover { transform:translateY(-2px); }
  button.cta:focus-visible, .swatch:focus-visible { outline:3px solid #b9788a; }
  #stage { height:min(86vh,720px); width:100%; cursor:grab; touch-action:pan-y; }
  #stage:active { cursor:grabbing; }
  .hint { text-align:center; font-size:.85rem; color:var(--muted); margin-top:-8px; }
  @media (max-width:820px) {
    .page { grid-template-columns:1fr; padding-top:20px; }
    .info { padding-bottom:0; text-align:center; }
    .tag { margin-left:auto; margin-right:auto; }
    .swatches, .buy { justify-content:center; }
    #stage { height:60vh; }
  }
</style>
</head>
<body>
<main class="page">
  <section class="info">
    <p class="brand">AURELLE</p>
    <h1 id="name">Rose Noir</h1>
    <p class="tag" id="tagline">A warm rose and dark amber eau de parfum. 50 ml.</p>
    <p class="shade-label">Shade: <b id="shadeName">Rose</b></p>
    <div class="swatches" id="swatches"></div>
    <div class="buy">
      <span class="price">₹2,499</span>
      <button class="cta" id="buy">Add to cart</button>
    </div>
  </section>
  <section>
    <div id="stage"></div>
    <p class="hint">Drag to rotate. Move your mouse to tilt.</p>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===== EASY THINGS TO CHANGE =====
const SHADES = [
  { shade:'Rose',   name:'Rose Noir',     tagline:'A warm rose and dark amber eau de parfum. 50 ml.', color:'#e0748f' },
  { shade:'Amber',  name:'Amber Dusk',    tagline:'Honeyed amber with soft vanilla and sandalwood. 50 ml.', color:'#e8a33d' },
  { shade:'Violet', name:'Violet Hour',   tagline:'Fresh violet, iris and white musk. 50 ml.', color:'#8e6bd1' },
  { shade:'Jade',   name:'Jade Garden',   tagline:'Green tea, mint and cool cedar. 50 ml.', color:'#3fae8f' },
];
const CAP_COLOR = '#c9a35b';   // cap colour
// =================================

const stage = document.getElementById('stage');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
camera.position.set(0, 0.4, 9);

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
stage.appendChild(renderer.domElement);

// Lights
scene.add(new THREE.AmbientLight(0xffffff, 0.7));
const key = new THREE.DirectionalLight(0xffffff, 0.9); key.position.set(4,5,6); scene.add(key);
const rim = new THREE.DirectionalLight(0xffd9e0, 0.6); rim.position.set(-5,2,-4); scene.add(rim);

const bottle = new THREE.Group();
scene.add(bottle);

// Glass body
const glass = new THREE.Mesh(
  new THREE.BoxGeometry(2.2, 2.6, 1.3),
  new THREE.MeshStandardMaterial({ color:0xffffff, transparent:true, opacity:0.28, roughness:0.05, metalness:0.1 })
);
bottle.add(glass);

// Perfume liquid (changes colour)
const liquidMat = new THREE.MeshStandardMaterial({ color:SHADES[0].color, roughness:0.25, metalness:0.1 });
const liquid = new THREE.Mesh(new THREE.BoxGeometry(1.95, 2.2, 1.05), liquidMat);
liquid.position.y = -0.1;
bottle.add(liquid);

// Neck and cap
const neck = new THREE.Mesh(
  new THREE.CylinderGeometry(0.32, 0.32, 0.35, 32),
  new THREE.MeshStandardMaterial({ color:CAP_COLOR, metalness:0.8, roughness:0.3 })
);
neck.position.y = 1.45;
bottle.add(neck);

const capMat = new THREE.MeshStandardMaterial({ color:CAP_COLOR, metalness:0.85, roughness:0.25 });
const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.62, 0.62, 0.95, 48), capMat);
cap.position.y = 2.05;
bottle.add(cap);

// Soft base shadow
const shadow = new THREE.Mesh(
  new THREE.CircleGeometry(1.9, 48),
  new THREE.MeshBasicMaterial({ color:0x3b1522, transparent:true, opacity:0.12 })
);
shadow.rotation.x = -Math.PI / 2;
shadow.position.y = -1.55;
scene.add(shadow);

bottle.position.y = -0.3;

// Colour picker
const swatchBox = document.getElementById('swatches');
SHADES.forEach((s, i) => {
  const b = document.createElement('button');
  b.className = 'swatch';
  b.style.background = s.color;
  b.setAttribute('aria-label', s.shade);
  b.setAttribute('aria-pressed', i === 0);
  b.onclick = () => pick(i);
  swatchBox.appendChild(b);
});
function pick(i) {
  const s = SHADES[i];
  liquidMat.color.set(s.color);
  document.getElementById('name').textContent = s.name;
  document.getElementById('tagline').textContent = s.tagline;
  document.getElementById('shadeName').textContent = s.shade;
  [...swatchBox.children].forEach((el, j) => el.setAttribute('aria-pressed', j === i));
}

// Add to cart
document.getElementById('buy').onclick = (e) => {
  e.target.textContent = 'Added';
  setTimeout(() => e.target.textContent = 'Add to cart', 1500);
};

// Interaction: drag to rotate + mouse tilt
let dragging = false, lastX = 0, spin = 0.3, targetTiltX = 0, targetTiltY = 0;
stage.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; });
window.addEventListener('pointerup', () => dragging = false);
window.addEventListener('pointermove', e => {
  if (dragging) { spin += (e.clientX - lastX) * 0.01; lastX = e.clientX; }
  const r = stage.getBoundingClientRect();
  targetTiltY = ((e.clientX - r.left) / r.width - 0.5) * 0.4;
  targetTiltX = ((e.clientY - r.top) / r.height - 0.5) * 0.3;
});

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

function animate() {
  requestAnimationFrame(animate);
  if (!dragging && !reduceMotion) spin += 0.006;
  bottle.rotation.y = spin;
  bottle.rotation.x += (targetTiltX - bottle.rotation.x) * 0.06;
  bottle.rotation.z += (-targetTiltY * 0.3 - bottle.rotation.z) * 0.06;
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
